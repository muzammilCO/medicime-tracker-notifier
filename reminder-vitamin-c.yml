name: Reminder - Vitamin C (weekly)

on:
  schedule:
    # 8:00 AM IST = 02:30 UTC, every Wednesday
    - cron: '30 2 * * 3'
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send push notification via ntfy.sh
        run: |
          curl -s \
            -H "Title: Vitamin C - weekly dose" \
            -H "Priority: default" \
            -H "Tags: pill" \
            -d "500mg chewable, with any meal." \
            "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
