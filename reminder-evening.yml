name: Reminder - Evening stack

on:
  schedule:
    # 8:30 PM IST = 15:00 UTC, every day
    - cron: '0 15 * * *'
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send push notification via ntfy.sh
        run: |
          curl -s \
            -H "Title: Evening stack" \
            -H "Priority: default" \
            -H "Tags: pill" \
            -d "Calcium+D3+Mg+Zn combo, Omega-3, Maglyci-D3 — with dinner." \
            "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
