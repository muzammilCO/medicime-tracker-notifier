name: Reminder - Morning stack

on:
  schedule:
    # 7:30 AM IST = 02:00 UTC, every day
    - cron: '0 2 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send push notification via ntfy.sh
        run: |
          curl -s \
            -H "Title: Morning stack" \
            -H "Priority: default" \
            -H "Tags: pill" \
            -d "Multivitamin + B-complex + Shilajit, with breakfast." \
            "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
