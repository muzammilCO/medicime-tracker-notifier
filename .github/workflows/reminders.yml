name: Reminders (dynamic, IST)

# One workflow handles every notification. It runs every 5 minutes, reads
# your notification times straight from data/schedule.json (in IST, no UTC
# math needed) and your supplement list from data/items.json, and sends only
# the notification(s) whose scheduled time matches right now.
#
# GitHub does NOT guarantee scheduled workflows run at the exact minute —
# they can be delayed, especially during high-load periods, and an exact-
# minute match can get silently skipped. So instead of requiring an exact
# match, each reminder is "due" for up to WINDOW_MIN minutes after its
# target time, and a "sent" marker (stored in data/logs.json, same file your
# check-off history lives in) stops it firing twice if GitHub runs this
# workflow more than once inside that window.
#
# Change WHEN something fires -> edit data/schedule.json (times are IST).
# Change WHAT it says          -> edit data/items.json (or use the app's
#                                  Manage Cabinet / Sync settings screens,
#                                  which sync here automatically once you've
#                                  connected the sync Worker — see README).
# Neither requires touching this file.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Send all notifications now, ignoring scheduled times (for testing)'
        type: boolean
        default: false

permissions:
  contents: write   # needed to commit the "sent" markers back to data/logs.json

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check schedule and send due notifications
        env:
          FORCE: ${{ github.event.inputs.force }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          WINDOW_MIN=90   # how many minutes late a run is still allowed to fire, once

          IST_TIME=$(TZ='Asia/Kolkata' date +%H:%M)
          IST_DATE=$(TZ='Asia/Kolkata' date +%F)
          IST_WEEKDAY=$(TZ='Asia/Kolkata' date +%w)   # 0 = Sunday ... 6 = Saturday
          echo "IST now: $IST_DATE $IST_TIME (weekday $IST_WEEKDAY)"

          CHANGED=false

          to_minutes() {
            local h=${1%%:*} m=${1##*:}
            echo $((10#$h * 60 + 10#$m))
          }
          CUR_MIN=$(to_minutes "$IST_TIME")

          due_window() {
            # $1 = schedule.json key. True if now is at or after the target
            # time and within WINDOW_MIN minutes of it.
            local target
            target=$(jq -r --arg k "$1" '.[$k] // empty' data/schedule.json)
            [ -z "$target" ] && return 1
            local target_min diff
            target_min=$(to_minutes "$target")
            diff=$((CUR_MIN - target_min))
            [ "$diff" -ge 0 ] && [ "$diff" -le "$WINDOW_MIN" ]
          }

          already_sent() {
            jq -e --arg d "$IST_DATE" --arg k "__sent_$1" '.[$d][$k] == true' data/logs.json >/dev/null 2>&1
          }
          mark_sent() {
            local tmp
            tmp=$(jq --arg d "$IST_DATE" --arg k "__sent_$1" '.[$d][$k] = true' data/logs.json)
            echo "$tmp" > data/logs.json
            CHANGED=true
          }

          send_daily_section() {
            # $1 = section name in items.json, $2 = notification title
            BODY=$(jq -r --arg s "$1" '
              [.[] | select(.section==$s and .freq.type=="daily")]
              | sort_by(.order) | map("• " + .name + " — " + .dose) | join("\n")
            ' data/items.json)
            [ -z "$BODY" ] && { echo "Nothing scheduled for $1, skipping."; return; }
            curl -s -H "Title: $2" -H "Tags: pill" -d "$BODY" "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
          }

          send_weekday() {
            # $1 = weekday number (0=Sun..6=Sat), $2 = notification title
            BODY=$(jq -r --argjson w "$1" '
              [.[] | select(.freq.type=="weekly" and .freq.weekday==$w)]
              | sort_by(.order)
              | map("• " + .name + " — " + .dose + (if .note then " (" + .note + ")" else "" end))
              | join("\n")
            ' data/items.json)
            [ -z "$BODY" ] && { echo "Nothing scheduled for weekday $1, skipping."; return; }
            curl -s -H "Title: $2" -H "Priority: high" -H "Tags: calendar,pill" -d "$BODY" "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
          }

          send_workout_section() {
            # $1 = section name (preworkout/postworkout), $2 = notification title
            BODY=$(jq -r --arg s "$1" '
              [.[] | select(.section==$s)]
              | sort_by(.order) | map("• " + .name + " — " + .dose) | join("\n")
            ' data/items.json)
            [ -z "$BODY" ] && { echo "Nothing scheduled for $1, skipping."; return; }
            curl -s -H "Title: $2" -H "Tags: muscle" -d "$BODY" "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
          }

          DAY_NAMES=(Sunday Monday Tuesday Wednesday Thursday Friday Saturday)

          # ---- Daily / workout reminders ----
          if [ "$FORCE" = "true" ] || { due_window morning && ! already_sent morning; }; then
            send_daily_section morning "Morning stack"
            [ "$FORCE" != "true" ] && mark_sent morning
          fi
          if [ "$FORCE" = "true" ] || { due_window evening && ! already_sent evening; }; then
            send_daily_section evening "Evening stack"
            [ "$FORCE" != "true" ] && mark_sent evening
          fi
          if [ "$FORCE" = "true" ] || { due_window workout_pre && ! already_sent workout_pre; }; then
            send_workout_section preworkout "Pre-workout"
            [ "$FORCE" != "true" ] && mark_sent workout_pre
          fi
          if [ "$FORCE" = "true" ] || { due_window workout_post && ! already_sent workout_post; }; then
            send_workout_section postworkout "Post-workout"
            [ "$FORCE" != "true" ] && mark_sent workout_post
          fi

          # ---- Weekly reminder ----
          if [ "$FORCE" = "true" ]; then
            # Test mode: send the weekly notification for every weekday that
            # has a configured time, regardless of what day it actually is.
            # Doesn't touch the "sent" markers.
            for WD in $(jq -r '.weekly // {} | keys[]' data/schedule.json); do
              send_weekday "$WD" "Weekly dose - ${DAY_NAMES[$WD]} (test)"
            done
          else
            WEEKLY_TARGET=$(jq -r --arg wd "$IST_WEEKDAY" '.weekly[$wd] // empty' data/schedule.json)
            if [ -n "$WEEKLY_TARGET" ]; then
              WEEKLY_TARGET_MIN=$(to_minutes "$WEEKLY_TARGET")
              WEEKLY_DIFF=$((CUR_MIN - WEEKLY_TARGET_MIN))
              if [ "$WEEKLY_DIFF" -ge 0 ] && [ "$WEEKLY_DIFF" -le "$WINDOW_MIN" ] && ! already_sent weekly; then
                send_weekday "$IST_WEEKDAY" "Weekly dose - ${DAY_NAMES[$IST_WEEKDAY]}"
                mark_sent weekly
              fi
            fi
          fi

          # ---- Commit "sent" markers so a delayed re-run doesn't duplicate ----
          if [ "$CHANGED" = "true" ]; then
            git config user.name "supplement-tracker-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/logs.json
            git commit -m "Mark reminders sent for $IST_DATE" || true
            for i in 1 2 3; do
              git pull --rebase origin "$BRANCH" && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 3
            done
          fi

          echo "Done."
