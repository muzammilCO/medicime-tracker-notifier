name: Reminders (dynamic, IST)

# ============================================================
# REMINDER SYSTEM
# ============================================================
#
# Cloudflare Worker triggers this workflow every 5 minutes
# using GitHub workflow_dispatch.
#
# Reminder behavior:
#
#   Scheduled time reached
#          ↓
#   Check whether required items are taken
#          ↓
#       NOT TAKEN
#          ↓
#   Send notification
#          ↓
#   Wait 15 minutes
#          ↓
#   Check again
#          ↓
#   Repeat until all relevant items are taken
#
# State separation:
#
#   data/logs.json
#       → medicine/workout TAKEN status
#       → READ ONLY by this workflow
#
#   data/notification-log.json
#       → last notification time
#       → written ONLY by this workflow
#
# ============================================================

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Send all notifications immediately for testing'
        type: boolean
        default: false

# Prevent two reminder runs from changing notification-log.json
# simultaneously.
concurrency:
  group: reminder-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check schedule and send reminders
        env:
          FORCE: ${{ inputs.force }}
          BRANCH: ${{ github.ref_name }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

        run: |
          set -e

          # ==========================================================
          # CONFIGURATION
          # ==========================================================

          # Cloudflare triggers GitHub every 5 minutes.
          # Notification itself is limited to once every 15 minutes.
          REPEAT_MIN=15

          IST_TIME=$(TZ='Asia/Kolkata' date +%H:%M)
          IST_DATE=$(TZ='Asia/Kolkata' date +%F)
          IST_WEEKDAY=$(TZ='Asia/Kolkata' date +%w)

          echo "=========================================="
          echo "Reminder workflow"
          echo "IST now: $IST_DATE $IST_TIME"
          echo "IST weekday: $IST_WEEKDAY"
          echo "Repeat interval: ${REPEAT_MIN} minutes"
          echo "Force: ${FORCE:-false}"
          echo "=========================================="

          CHANGED=false

          # ==========================================================
          # ENSURE NOTIFICATION LOG EXISTS
          # ==========================================================

          if [ ! -f data/notification-log.json ]; then
            echo "{}" > data/notification-log.json
            CHANGED=true
          fi

          # ==========================================================
          # TIME HELPERS
          # ==========================================================

          to_minutes() {
            local h=${1%%:*}
            local m=${1##*:}
            echo $((10#$h * 60 + 10#$m))
          }

          CUR_MIN=$(to_minutes "$IST_TIME")

          # ==========================================================
          # DAILY SCHEDULE
          # ==========================================================

          get_schedule_time() {
            local key="$1"

            jq -r \
              --arg k "$key" \
              '.[$k] // empty' \
              data/schedule.json
          }

          # ==========================================================
          # CHECK WHETHER TARGET TIME HAS BEEN REACHED
          #
          # Once today's target time has passed, the reminder remains
          # eligible until the relevant items are taken.
          #
          # Because the state is stored under IST_DATE, yesterday's
          # state cannot suppress today's reminder.
          # ==========================================================

          reminder_due() {
            local target="$1"
            local target_min
            local diff

            [ -z "$target" ] && return 1

            target_min=$(to_minutes "$target")
            diff=$((CUR_MIN - target_min))

            echo "Target=$target current=$IST_TIME diff=${diff}min"

            [ "$diff" -ge 0 ]
          }

          # ==========================================================
          # NOTIFICATION LOG
          # ==========================================================

          get_last_sent() {
            local marker="$1"

            jq -r \
              --arg d "$IST_DATE" \
              --arg k "$marker" \
              '.[$d][$k] // -9999' \
              data/notification-log.json
          }

          can_send_again() {
            local marker="$1"
            local last_sent

            last_sent=$(get_last_sent "$marker")

            if [ "$last_sent" = "-9999" ]; then
              echo "$marker: never sent today"
              return 0
            fi

            local elapsed=$((CUR_MIN - last_sent))

            echo "$marker: last notification ${elapsed} minutes ago"

            [ "$elapsed" -ge "$REPEAT_MIN" ]
          }

          mark_sent() {
            local marker="$1"
            local tmp

            tmp=$(jq \
              --arg d "$IST_DATE" \
              --arg k "$marker" \
              --argjson t "$CUR_MIN" '
                .[$d] //= {}
                | .[$d][$k] = $t
              ' \
              data/notification-log.json)

            echo "$tmp" > data/notification-log.json

            CHANGED=true

            echo "Recorded notification: $marker at $IST_TIME"
          }

          # ==========================================================
          # DAILY ITEMS
          #
          # Reads logs.json ONLY.
          # Never modifies it.
          # ==========================================================

          all_daily_taken() {
            local section="$1"
            local ids

            ids=$(jq -r \
              --arg s "$section" '
                .[] |
                select(
                  .section == $s and
                  .freq.type == "daily"
                ) |
                .id
              ' \
              data/items.json)

            if [ -z "$ids" ]; then
              echo "$section: no daily items"
              return 0
            fi

            for id in $ids; do

              TAKEN=$(jq -r \
                --arg d "$IST_DATE" \
                --arg id "$id" \
                '.[$d][$id] // false' \
                data/logs.json)

              echo "$section: $id = $TAKEN"

              if [ "$TAKEN" != "true" ]; then
                return 1
              fi

            done

            return 0
          }

          # ==========================================================
          # WORKOUT STATUS
          # ==========================================================

          workout_active() {
            jq -e \
              --arg d "$IST_DATE" \
              '.[$d].__workout == true' \
              data/logs.json \
              >/dev/null 2>&1
          }

          # ==========================================================
          # WORKOUT ITEMS
          # ==========================================================

          all_workout_taken() {
            local section="$1"
            local ids

            ids=$(jq -r \
              --arg s "$section" '
                .[] |
                select(
                  .section == $s and
                  .freq.type == "workout"
                ) |
                .id
              ' \
              data/items.json)

            if [ -z "$ids" ]; then
              echo "$section: no workout items"
              return 0
            fi

            for id in $ids; do

              TAKEN=$(jq -r \
                --arg d "$IST_DATE" \
                --arg id "$id" \
                '.[$d][$id] // false' \
                data/logs.json)

              echo "$section: $id = $TAKEN"

              if [ "$TAKEN" != "true" ]; then
                return 1
              fi

            done

            return 0
          }

          # ==========================================================
          # SEND DAILY SECTION
          # ==========================================================

          send_daily_section() {
            local section="$1"
            local title="$2"
            local body

            body=$(jq -r \
              --arg s "$section" '
                [.[] |
                  select(
                    .section == $s and
                    .freq.type == "daily"
                  )
                ]
                | sort_by(.order)
                | map(
                    "• " + .name + " — " + .dose +
                    (if .note then " (" + .note + ")" else "" end)
                  )
                | join("\n")
              ' \
              data/items.json)

            if [ -z "$body" ]; then
              echo "Nothing scheduled for $section."
              return 0
            fi

            echo "Sending: $title"
            echo "$body"

            curl -fsS \
              -H "Title: $title" \
              -H "Tags: pill" \
              -d "$body" \
              "https://ntfy.sh/${NTFY_TOPIC}"

            echo "Notification sent successfully: $title"
          }

          # ==========================================================
          # SEND WORKOUT SECTION
          # ==========================================================

          send_workout_section() {
            local section="$1"
            local title="$2"
            local body

            body=$(jq -r \
              --arg s "$section" '
                [.[] |
                  select(
                    .section == $s and
                    .freq.type == "workout"
                  )
                ]
                | sort_by(.order)
                | map(
                    "• " + .name + " — " + .dose +
                    (if .note then " (" + .note + ")" else "" end)
                  )
                | join("\n")
              ' \
              data/items.json)

            if [ -z "$body" ]; then
              echo "Nothing scheduled for $section."
              return 0
            fi

            echo "Sending: $title"
            echo "$body"

            curl -fsS \
              -H "Title: $title" \
              -H "Tags: muscle" \
              -d "$body" \
              "https://ntfy.sh/${NTFY_TOPIC}"

            echo "Notification sent successfully: $title"
          }

          # ==========================================================
          # SEND WEEKLY SLOT
          # ==========================================================

          send_weekly_slot() {
            local weekday="$1"
            local slot="$2"
            local title="$3"
            local body

            body=$(jq -r \
              --argjson w "$weekday" \
              --arg s "$slot" '
                [.[] |
                  select(
                    .freq.type == "weekly" and
                    .freq.weekday == $w and
                    .freq.slot == $s
                  )
                ]
                | sort_by(.order)
                | map(
                    "• " + .name + " — " + .dose +
                    (if .note then " (" + .note + ")" else "" end)
                  )
                | join("\n")
              ' \
              data/items.json)

            if [ -z "$body" ]; then
              echo "No weekly items for weekday=$weekday slot=$slot"
              return 0
            fi

            echo "Sending: $title"
            echo "$body"

            curl -fsS \
              -H "Title: $title" \
              -H "Priority: high" \
              -H "Tags: calendar,pill" \
              -d "$body" \
              "https://ntfy.sh/${NTFY_TOPIC}"

            echo "Notification sent successfully: $title"
          }

          DAY_NAMES=(
            Sunday
            Monday
            Tuesday
            Wednesday
            Thursday
            Friday
            Saturday
          )

          # ==========================================================
          # MORNING
          # ==========================================================

          MORNING_TARGET=$(get_schedule_time morning)

          if [ "$FORCE" = "true" ]; then

            send_daily_section morning "Morning stack"

          elif [ -n "$MORNING_TARGET" ] && \
               reminder_due "$MORNING_TARGET"; then

            if all_daily_taken morning; then

              echo "Morning: all items taken. No notification."

            elif can_send_again morning; then

              send_daily_section morning "Morning stack"
              mark_sent morning

            else

              echo "Morning: waiting for 15-minute interval."

            fi

          fi

          # ==========================================================
          # EVENING
          # ==========================================================

          EVENING_TARGET=$(get_schedule_time evening)

          if [ "$FORCE" = "true" ]; then

            send_daily_section evening "Evening stack"

          elif [ -n "$EVENING_TARGET" ] && \
               reminder_due "$EVENING_TARGET"; then

            if all_daily_taken evening; then

              echo "Evening: all items taken. No notification."

            elif can_send_again evening; then

              send_daily_section evening "Evening stack"
              mark_sent evening

            else

              echo "Evening: waiting for 15-minute interval."

            fi

          fi

          # ==========================================================
          # PRE-WORKOUT
          #
          # L-Arginine is freq.type = workout.
          # Only active when __workout == true.
          # ==========================================================

          PRE_TARGET=$(get_schedule_time workout_pre)

          if [ "$FORCE" = "true" ]; then

            send_workout_section preworkout "Pre-workout"

          elif workout_active && \
               [ -n "$PRE_TARGET" ] && \
               reminder_due "$PRE_TARGET"; then

            if all_workout_taken preworkout; then

              echo "Pre-workout: item taken. No notification."

            elif can_send_again workout_pre; then

              send_workout_section preworkout "Pre-workout"
              mark_sent workout_pre

            else

              echo "Pre-workout: waiting for 15-minute interval."

            fi

          fi

          # ==========================================================
          # POST-WORKOUT
          #
          # IMPORTANT:
          # protein + creatine are DAILY items in items.json.
          # Therefore this reminder is NOT gated by __workout.
          # ==========================================================

          POST_TARGET=$(get_schedule_time workout_post)

          if [ "$FORCE" = "true" ]; then

            send_daily_section postworkout "Post-workout"

          elif [ -n "$POST_TARGET" ] && \
               reminder_due "$POST_TARGET"; then

            if all_daily_taken postworkout; then

              echo "Post-workout: all items taken. No notification."

            elif can_send_again workout_post; then

              send_daily_section postworkout "Post-workout"
              mark_sent workout_post

            else

              echo "Post-workout: waiting for 15-minute interval."

            fi

          fi

          # ==========================================================
          # WEEKLY
          #
          # Each weekday + slot is independent.
          #
          # Example:
          #   Saturday morning -> vitc
          #   Saturday night   -> d3high
          # ==========================================================

          if [ "$FORCE" = "true" ]; then

            echo "FORCE mode: sending all configured weekly slots."

            for WD in $(jq -r '.weekly // {} | keys[]' data/schedule.json); do

              for SLOT in $(jq -r \
                --arg wd "$WD" \
                '.weekly[$wd] // {} | keys[]' \
                data/schedule.json); do

                send_weekly_slot \
                  "$WD" \
                  "$SLOT" \
                  "Weekly dose - ${DAY_NAMES[$WD]} ${SLOT} (test)"

              done

            done

          else

            for SLOT in $(jq -r \
              --arg wd "$IST_WEEKDAY" \
              '.weekly[$wd] // {} | keys[]' \
              data/schedule.json); do

              WEEKLY_TARGET=$(jq -r \
                --arg wd "$IST_WEEKDAY" \
                --arg slot "$SLOT" \
                '.weekly[$wd][$slot] // empty' \
                data/schedule.json)

              [ -z "$WEEKLY_TARGET" ] && continue

              WEEKLY_TARGET_MIN=$(to_minutes "$WEEKLY_TARGET")
              WEEKLY_DIFF=$((CUR_MIN - WEEKLY_TARGET_MIN))

              MARKER="weekly_${IST_WEEKDAY}_${SLOT}"

              echo "Checking weekly $SLOT: target=$WEEKLY_TARGET diff=${WEEKLY_DIFF}min"

              # ------------------------------------------------------
              # Find the actual item IDs for this weekday + slot.
              # ------------------------------------------------------

              WEEKLY_IDS=$(jq -r \
                --argjson w "$IST_WEEKDAY" \
                --arg s "$SLOT" '
                  .[] |
                  select(
                    .freq.type == "weekly" and
                    .freq.weekday == $w and
                    .freq.slot == $s
                  ) |
                  .id
                ' \
                data/items.json)

              ALL_TAKEN=true

              if [ -z "$WEEKLY_IDS" ]; then

                echo "No weekly items configured for $MARKER."

              else

                for ID in $WEEKLY_IDS; do

                  TAKEN=$(jq -r \
                    --arg d "$IST_DATE" \
                    --arg id "$ID" \
                    '.[$d][$id] // false' \
                    data/logs.json)

                  echo "Weekly $MARKER: $ID = $TAKEN"

                  if [ "$TAKEN" != "true" ]; then
                    ALL_TAKEN=false
                  fi

                done

              fi

              if [ "$ALL_TAKEN" = "true" ]; then

                echo "Weekly $MARKER: all items taken."

              elif [ "$WEEKLY_DIFF" -ge 0 ] && \
                   can_send_again "$MARKER"; then

                send_weekly_slot \
                  "$IST_WEEKDAY" \
                  "$SLOT" \
                  "Weekly dose - ${DAY_NAMES[$IST_WEEKDAY]} ${SLOT}"

                mark_sent "$MARKER"

              else

                echo "Weekly $MARKER: waiting for 15-minute interval."

              fi

            done

          fi

          # ==========================================================
          # SAVE NOTIFICATION STATE
          #
          # ONLY notification-log.json is committed.
          #
          # logs.json is NEVER staged, committed or modified.
          # ==========================================================

          if [ "$CHANGED" = "true" ]; then

            echo "Updating data/notification-log.json..."

            git config user.name "supplement-tracker-bot"
            git config user.email "actions@users.noreply.github.com"

            git add data/notification-log.json

            git commit \
              -m "Update notification state for $IST_DATE" || true

            for i in 1 2 3; do

              if git pull --rebase origin "$BRANCH" && \
                 git push origin "$BRANCH"; then

                echo "Notification state pushed successfully."
                break

              fi

              echo "Push attempt $i failed, retrying..."
              sleep 3

            done

          else

            echo "No notification state changed."

          fi

          echo "=========================================="
          echo "Reminder processing complete."
          echo "=========================================="
