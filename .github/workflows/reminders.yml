name: Schedule Test

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Show time
        run: |
          echo "UTC: $(date -u)"
          echo "IST: $(TZ='Asia/Kolkata' date)"
          echo "This workflow was triggered by: ${{ github.event_name }}"
