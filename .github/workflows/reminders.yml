name: Reminders (dynamic, IST)

# ============================================================
# REMINDER SYSTEM
# ============================================================
#
# Cloudflare Worker calls this workflow using workflow_dispatch.
#
# Cloudflare should trigger this workflow every 5 minutes.
#
# Notification behavior:
#
#   Scheduled time reached
#          ↓
#   Is notifications globally enabled?
#          ↓
#       YES
#          ↓
#   Are all relevant items taken?
#          ↓
#      NO
#          ↓
#   Send notification
#          ↓
#   Wait 15 minutes
#          ↓
#   Repeat until taken
#
# Files:
#
#   data/items.json
#       WHAT should be taken
#
#   data/schedule.json
#       WHEN reminders should start
#
#   data/logs.json
#       WHETHER items were taken
#       READ ONLY by this workflow
#
#   data/notification-log.json
#       WHEN notifications were last sent
#       WRITTEN ONLY by this workflow
#
#   data/notification-settings.json
#       Global notification ON/OFF
#
#   data/workout-settings.json
#       Default workout days
#
# ============================================================

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Send all notifications immediately for testing"
        type: boolean
        default: false

# Prevent two executions from modifying notification-log.json
# at the same time.
concurrency:
  group: reminder-run
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check schedule and send reminders
        env:
          FORCE: ${{ inputs.force }}
          BRANCH: ${{ github.ref_name }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

        run: |
          set -e

          # ==========================================================
          # CONFIGURATION
          # ==========================================================

          # Cloudflare calls GitHub every 5 minutes.
          # Notifications themselves repeat every 15 minutes.
          REPEAT_MIN=15

          IST_TIME=$(TZ='Asia/Kolkata' date +%H:%M)
          IST_DATE=$(TZ='Asia/Kolkata' date +%F)
          IST_WEEKDAY=$(TZ='Asia/Kolkata' date +%w)

          echo "=========================================="
          echo "Reminder workflow"
          echo "IST now: $IST_DATE $IST_TIME"
          echo "IST weekday: $IST_WEEKDAY"
          echo "Repeat interval: $REPEAT_MIN minutes"
          echo "Force: ${FORCE:-false}"
          echo "=========================================="

          CHANGED=false

          # ==========================================================
          # ENSURE NOTIFICATION LOG EXISTS AND IS VALID JSON
          # ==========================================================

          if [ ! -f data/notification-log.json ]; then
            echo "{}" > data/notification-log.json
          fi

          if ! jq empty data/notification-log.json >/dev/null 2>&1; then
            echo "notification-log.json is empty or invalid."
            echo "Resetting to {}."
            echo "{}" > data/notification-log.json
          fi

          # ==========================================================
          # GLOBAL NOTIFICATION SETTING
          # ==========================================================

          NOTIFICATIONS_ENABLED=$(jq -r \
            '.enabled // true' \
            data/notification-settings.json 2>/dev/null || echo "true")

          echo "Notifications enabled: $NOTIFICATIONS_ENABLED"

          if [ "$NOTIFICATIONS_ENABLED" != "true" ]; then
            echo "Notifications are globally disabled."
            echo "No notifications will be sent."
            exit 0
          fi

          # ==========================================================
          # TIME HELPERS
          # ==========================================================

          to_minutes() {
            local h=${1%%:*}
            local m=${1##*:}

            echo $((10#$h * 60 + 10#$m))
          }

          CUR_MIN=$(to_minutes "$IST_TIME")

          # ==========================================================
          # GET SCHEDULE TIME
          # ==========================================================

          get_schedule_time() {
            local key="$1"

            jq -r \
              --arg k "$key" \
              '.[$k] // empty' \
              data/schedule.json
          }

          # ==========================================================
          # CHECK WHETHER REMINDER TIME HAS ARRIVED
          #
          # Once the scheduled time has passed, the reminder remains
          # eligible for the rest of the current day until taken.
          #
          # A new IST_DATE automatically starts a fresh reminder day.
          # ==========================================================

          reminder_due() {
            local target="$1"
            local target_min
            local diff

            [ -z "$target" ] && return 1

            target_min=$(to_minutes "$target")
            diff=$((CUR_MIN - target_min))

            echo "Target=$target current=$IST_TIME diff=${diff}min"

            [ "$diff" -ge 0 ]
          }

          # ==========================================================
          # NOTIFICATION LOG
          #
          # Example:
          #
          # {
          #   "2026-08-29": {
          #     "morning": 510,
          #     "evening": 1379,
          #     "workout_pre": 1090,
          #     "workout_post": 1150,
          #     "weekly_6_night": 1335
          #   }
          # }
          # ==========================================================

          get_last_sent() {
            local marker="$1"

            jq -r \
              --arg d "$IST_DATE" \
              --arg k "$marker" \
              '.[$d][$k] // -9999' \
              data/notification-log.json
          }

          can_send_again() {
            local marker="$1"
            local last_sent

            last_sent=$(get_last_sent "$marker")

            if [ "$last_sent" = "-9999" ]; then
              echo "$marker: no notification sent today"
              return 0
            fi

            local elapsed=$((CUR_MIN - last_sent))

            echo "$marker: last notification $elapsed minutes ago"

            [ "$elapsed" -ge "$REPEAT_MIN" ]
          }

          mark_sent() {
            local marker="$1"
            local tmp

            # Recover automatically if file somehow becomes invalid.
            if ! jq empty data/notification-log.json >/dev/null 2>&1; then
              echo "{}" > data/notification-log.json
            fi

            tmp=$(jq \
              --arg d "$IST_DATE" \
              --arg k "$marker" \
              --argjson t "$CUR_MIN" '
                .[$d] //= {}
                | .[$d][$k] = $t
              ' \
              data/notification-log.json)

            printf '%s\n' "$tmp" > data/notification-log.json

            CHANGED=true

            echo "Recorded notification: $marker at $IST_TIME"
          }

          # ==========================================================
          # DAILY ITEMS
          #
          # READS logs.json ONLY.
          # NEVER modifies logs.json.
          # ==========================================================

          all_daily_taken() {
            local section="$1"
            local ids

            ids=$(jq -r \
              --arg s "$section" '
                .[] |
                select(
                  .section == $s and
                  .freq.type == "daily"
                ) |
                .id
              ' \
              data/items.json)

            if [ -z "$ids" ]; then
              echo "$section: no daily items configured"
              return 0
            fi

            for id in $ids; do

              TAKEN=$(jq -r \
                --arg d "$IST_DATE" \
                --arg id "$id" \
                '.[$d][$id] // false' \
                data/logs.json)

              echo "$section: $id = $TAKEN"

              if [ "$TAKEN" != "true" ]; then
                return 1
              fi

            done

            return 0
          }

          # ==========================================================
          # WORKOUT DAY
          #
          # Priority:
          #
          # 1. Explicit __workout value in today's logs.json
          # 2. Default day from workout-settings.json
          #
          # This means you can override an individual day without
          # changing your normal weekly workout schedule.
          # ==========================================================

          is_workout_day() {
            local explicit

            explicit=$(jq -r \
              --arg d "$IST_DATE" \
              'if .[$d] and (.[$d] | has("__workout"))
               then .[$d].__workout
               else "unset"
               end' \
              data/logs.json)

            if [ "$explicit" = "true" ]; then
              echo "Workout day: explicit ON"
              return 0
            fi

            if [ "$explicit" = "false" ]; then
              echo "Workout day: explicit OFF"
              return 1
            fi

            local default

            default=$(jq -r \
              --arg wd "$IST_WEEKDAY" \
              '.days[$wd] // false' \
              data/workout-settings.json 2>/dev/null || echo "false")

            echo "Workout day: default=$default"

            [ "$default" = "true" ]
          }

          # ==========================================================
          # WORKOUT ITEMS
          #
          # Only items with freq.type == workout are checked here.
          # ==========================================================

          all_workout_taken() {
            local section="$1"
            local ids

            ids=$(jq -r \
              --arg s "$section" '
                .[] |
                select(
                  .section == $s and
                  .freq.type == "workout"
                ) |
                .id
              ' \
              data/items.json)

            if [ -z "$ids" ]; then
              echo "$section: no workout items configured"
              return 0
            fi

            for id in $ids; do

              TAKEN=$(jq -r \
                --arg d "$IST_DATE" \
                --arg id "$id" \
                '.[$d][$id] // false' \
                data/logs.json)

              echo "$section: $id = $TAKEN"

              if [ "$TAKEN" != "true" ]; then
                return 1
              fi

            done

            return 0
          }

          # ==========================================================
          # SEND DAILY SECTION
          # ==========================================================

          send_daily_section() {
            local section="$1"
            local title="$2"
            local body

            body=$(jq -r \
              --arg s "$section" '
                [.[] |
                  select(
                    .section == $s and
                    .freq.type == "daily"
                  )
                ]
                | sort_by(.order)
                | map(
                    "• " + .name + " — " + .dose +
                    (if .note then " (" + .note + ")" else "" end)
                  )
                | join("\n")
              ' \
              data/items.json)

            if [ -z "$body" ]; then
              echo "Nothing scheduled for $section."
              return 0
            fi

            echo "Sending: $title"
            echo "$body"

            curl -fsS \
              -H "Title: $title" \
              -H "Tags: pill" \
              -d "$body" \
              "https://ntfy.sh/${NTFY_TOPIC}"

            echo "Notification sent successfully: $title"
          }

          # ==========================================================
          # SEND WORKOUT SECTION
          # ==========================================================

          send_workout_section() {
            local section="$1"
            local title="$2"
            local body

            body=$(jq -r \
              --arg s "$section" '
                [.[] |
                  select(
                    .section == $s and
                    .freq.type == "workout"
                  )
                ]
                | sort_by(.order)
                | map(
                    "• " + .name + " — " + .dose +
                    (if .note then " (" + .note + ")" else "" end)
                  )
                | join("\n")
              ' \
              data/items.json)

            if [ -z "$body" ]; then
              echo "Nothing scheduled for $section."
              return 0
            fi

            # Add the daily workout description if one exists.
            WORKOUT_DESCRIPTION=$(jq -r \
              --arg d "$IST_DATE" \
              '.[$d].__workout_details // empty' \
              data/logs.json)

            if [ -n "$WORKOUT_DESCRIPTION" ]; then
              body="Workout: ${WORKOUT_DESCRIPTION}"$'\n\n'"$body"
            fi

            echo "Sending: $title"
            echo "$body"

            curl -fsS \
              -H "Title: $title" \
              -H "Tags: muscle" \
              -d "$body" \
              "https://ntfy.sh/${NTFY_TOPIC}"

            echo "Notification sent successfully: $title"
          }

          # ==========================================================
          # SEND DAILY POST-WORKOUT SECTION
          #
          # Protein + creatine are DAILY in your items.json.
          # Therefore post-workout is checked every day.
          # ==========================================================

          send_postworkout_section() {
            local title="$1"
            local body

            body=$(jq -r '
              [.[] |
                select(
                  .section == "postworkout" and
                  .freq.type == "daily"
                )
              ]
              | sort_by(.order)
              | map(
                  "• " + .name + " — " + .dose +
                  (if .note then " (" + .note + ")" else "" end)
                )
              | join("\n")
            ' \
            data/items.json)

            if [ -z "$body" ]; then
              echo "Nothing scheduled for postworkout."
              return 0
            fi

            WORKOUT_DESCRIPTION=$(jq -r \
              --arg d "$IST_DATE" \
              '.[$d].__workout_details // empty' \
              data/logs.json)

            if [ -n "$WORKOUT_DESCRIPTION" ]; then
              body="Workout: ${WORKOUT_DESCRIPTION}"$'\n\n'"$body"
            fi

            echo "Sending: $title"
            echo "$body"

            curl -fsS \
              -H "Title: $title" \
              -H "Tags: muscle,pill" \
              -d "$body" \
              "https://ntfy.sh/${NTFY_TOPIC}"

            echo "Notification sent successfully: $title"
          }

          # ==========================================================
          # SEND WEEKLY SLOT
          # ==========================================================

          send_weekly_slot() {
            local weekday="$1"
            local slot="$2"
            local title="$3"
            local body

            body=$(jq -r \
              --argjson w "$weekday" \
              --arg s "$slot" '
                [.[] |
                  select(
                    .freq.type == "weekly" and
                    .freq.weekday == $w and
                    .freq.slot == $s
                  )
                ]
                | sort_by(.order)
                | map(
                    "• " + .name + " — " + .dose +
                    (if .note then " (" + .note + ")" else "" end)
                  )
                | join("\n")
              ' \
              data/items.json)

            if [ -z "$body" ]; then
              echo "No weekly items configured for weekday=$weekday slot=$slot."
              return 1
            fi

            echo "Sending: $title"
            echo "$body"

            curl -fsS \
              -H "Title: $title" \
              -H "Priority: high" \
              -H "Tags: calendar,pill" \
              -d "$body" \
              "https://ntfy.sh/${NTFY_TOPIC}"

            echo "Notification sent successfully: $title"
          }

          # ==========================================================
          # CHECK WHETHER ALL WEEKLY ITEMS ARE TAKEN
          # ==========================================================

          all_weekly_taken() {
            local weekday="$1"
            local slot="$2"
            local ids

            ids=$(jq -r \
              --argjson w "$weekday" \
              --arg s "$slot" '
                .[] |
                select(
                  .freq.type == "weekly" and
                  .freq.weekday == $w and
                  .freq.slot == $s
                ) |
                .id
              ' \
              data/items.json)

            # No items means this slot should not send.
            if [ -z "$ids" ]; then
              echo "No weekly items exist for weekday=$weekday slot=$slot."
              return 0
            fi

            for id in $ids; do

              TAKEN=$(jq -r \
                --arg d "$IST_DATE" \
                --arg id "$id" \
                '.[$d][$id] // false' \
                data/logs.json)

              echo "Weekly $weekday/$slot: $id = $TAKEN"

              if [ "$TAKEN" != "true" ]; then
                return 1
              fi

            done

            return 0
          }

          # ==========================================================
          # DAY NAMES
          # ==========================================================

          DAY_NAMES=(
            Sunday
            Monday
            Tuesday
            Wednesday
            Thursday
            Friday
            Saturday
          )

          # ==========================================================
          # FORCE MODE
          #
          # Force sends configured notifications immediately.
          #
          # It does NOT bypass the global notification ON/OFF switch,
          # which was checked above.
          #
          # Force does not modify notification-log.json because this
          # is a test and should not interfere with the real 15-minute
          # reminder cycle.
          # ==========================================================

          if [ "$FORCE" = "true" ]; then

            echo "=========================================="
            echo "FORCE TEST MODE"
            echo "=========================================="

            send_daily_section morning "Morning stack"

            send_daily_section evening "Evening stack"

            if is_workout_day; then
              send_workout_section preworkout "Pre-workout"
            else
              echo "Pre-workout skipped: today is not a workout day."
            fi

            send_postworkout_section "Post-workout"

            for WD in $(jq -r '.weekly // {} | keys[]' data/schedule.json); do

              for SLOT in $(jq -r \
                --arg wd "$WD" \
                '.weekly[$wd] // {} | keys[]' \
                data/schedule.json); do

                send_weekly_slot \
                  "$WD" \
                  "$SLOT" \
                  "Weekly dose - ${DAY_NAMES[$WD]} ${SLOT} (test)" \
                  || true

              done

            done

            echo "Force test complete."
            exit 0
          fi

          # ==========================================================
          # MORNING
          # ==========================================================

          MORNING_TARGET=$(get_schedule_time morning)

          if [ -n "$MORNING_TARGET" ] && \
             reminder_due "$MORNING_TARGET"; then

            if all_daily_taken morning; then

              echo "Morning: all items taken. No notification."

            elif can_send_again morning; then

              send_daily_section morning "Morning stack"
              mark_sent morning

            else

              echo "Morning: waiting for 15-minute interval."

            fi

          else

            echo "Morning: not due yet."

          fi

          # ==========================================================
          # EVENING
          # ==========================================================

          EVENING_TARGET=$(get_schedule_time evening)

          if [ -n "$EVENING_TARGET" ] && \
             reminder_due "$EVENING_TARGET"; then

            if all_daily_taken evening; then

              echo "Evening: all items taken. No notification."

            elif can_send_again evening; then

              send_daily_section evening "Evening stack"
              mark_sent evening

            else

              echo "Evening: waiting for 15-minute interval."

            fi

          else

            echo "Evening: not due yet."

          fi

          # ==========================================================
          # PRE-WORKOUT
          #
          # Only active when today is a workout day.
          # ==========================================================

          PRE_TARGET=$(get_schedule_time workout_pre)

          if is_workout_day; then

            if [ -n "$PRE_TARGET" ] && \
               reminder_due "$PRE_TARGET"; then

              if all_workout_taken preworkout; then

                echo "Pre-workout: item taken. No notification."

              elif can_send_again workout_pre; then

                send_workout_section preworkout "Pre-workout"
                mark_sent workout_pre

              else

                echo "Pre-workout: waiting for 15-minute interval."

              fi

            else

              echo "Pre-workout: not due yet."

            fi

          else

            echo "Pre-workout: today is not a workout day."

          fi

          # ==========================================================
          # POST-WORKOUT
          #
          # Protein + creatine are DAILY items, so this runs every day.
          # ==========================================================

          POST_TARGET=$(get_schedule_time workout_post)

          if [ -n "$POST_TARGET" ] && \
             reminder_due "$POST_TARGET"; then

            if all_daily_taken postworkout; then

              echo "Post-workout: all items taken. No notification."

            elif can_send_again workout_post; then

              send_postworkout_section "Post-workout"
              mark_sent workout_post

            else

              echo "Post-workout: waiting for 15-minute interval."

            fi

          else

            echo "Post-workout: not due yet."

          fi

          # ==========================================================
          # WEEKLY REMINDERS
          #
          # Each weekday + slot has its own independent state.
          # ==========================================================

          for SLOT in $(jq -r \
            --arg wd "$IST_WEEKDAY" \
            '.weekly[$wd] // {} | keys[]' \
            data/schedule.json); do

            WEEKLY_TARGET=$(jq -r \
              --arg wd "$IST_WEEKDAY" \
              --arg slot "$SLOT" \
              '.weekly[$wd][$slot] // empty' \
              data/schedule.json)

            [ -z "$WEEKLY_TARGET" ] && continue

            WEEKLY_TARGET_MIN=$(to_minutes "$WEEKLY_TARGET")
            WEEKLY_DIFF=$((CUR_MIN - WEEKLY_TARGET_MIN))

            MARKER="weekly_${IST_WEEKDAY}_${SLOT}"

            echo "Checking weekly $SLOT: target=$WEEKLY_TARGET diff=${WEEKLY_DIFF}min"

            WEEKLY_IDS=$(jq -r \
              --argjson w "$IST_WEEKDAY" \
              --arg s "$SLOT" '
                .[] |
                select(
                  .freq.type == "weekly" and
                  .freq.weekday == $w and
                  .freq.slot == $s
                ) |
                .id
              ' \
              data/items.json)

            # No actual medicine/item exists for this schedule slot.
            if [ -z "$WEEKLY_IDS" ]; then
              echo "No weekly items configured for $MARKER. Skipping."
              continue
            fi

            if [ "$WEEKLY_DIFF" -lt 0 ]; then

              echo "Weekly $MARKER: not due yet."
              continue

            fi

            if all_weekly_taken "$IST_WEEKDAY" "$SLOT"; then

              echo "Weekly $MARKER: all items taken. No notification."

            elif can_send_again "$MARKER"; then

              send_weekly_slot \
                "$IST_WEEKDAY" \
                "$SLOT" \
                "Weekly dose - ${DAY_NAMES[$IST_WEEKDAY]} ${SLOT}"

              mark_sent "$MARKER"

            else

              echo "Weekly $MARKER: waiting for 15-minute interval."

            fi

          done

          # ==========================================================
          # COMMIT ONLY notification-log.json
          #
          # logs.json is NEVER staged or committed.
          # ==========================================================

          if [ "$CHANGED" = "true" ]; then

            echo "=========================================="
            echo "Updating data/notification-log.json..."
            echo "=========================================="

            echo "Notification log:"
            cat data/notification-log.json

            git config user.name "supplement-tracker-bot"
            git config user.email "actions@users.noreply.github.com"

            # Force-add to protect against an existing .gitignore rule.
            git add -f data/notification-log.json

            if git diff --cached --quiet -- data/notification-log.json; then
              echo "ERROR: notification-log.json was not staged."
              echo "Current file:"
              cat data/notification-log.json
              exit 1
            fi

            git commit \
              -m "Update notification state for $IST_DATE"

            for i in 1 2 3; do

              echo "Push attempt $i..."

              if git pull --rebase origin "$BRANCH" && \
                 git push origin "$BRANCH"; then

                echo "Notification state pushed successfully."
                break

              fi

              if [ "$i" = "3" ]; then
                echo "ERROR: Failed to push notification state."
                exit 1
              fi

              echo "Push attempt $i failed, retrying..."
              sleep 3

            done

          else

            echo "No notification state changed."

          fi

          echo "=========================================="
          echo "Reminder processing complete."
          echo "=========================================="
