name: Reminder - Vitamin D3 60,000 IU (weekly)

on:
  schedule:
    # 8:00 AM IST = 02:30 UTC, every Sunday
    - cron: '30 2 * * 0'
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send push notification via ntfy.sh
        run: |
          curl -s \
            -H "Title: Vitamin D3 - weekly dose" \
            -H "Priority: high" \
            -H "Tags: calendar,pill" \
            -d "60,000 IU with a meal. Correction phase — check whether your 8-10 weeks are up." \
            "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
