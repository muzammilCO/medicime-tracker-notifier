name: Schedule Debug

on:
  schedule:
    # Runs at minute 15 and 45 of every hour (UTC)
    # This avoids heavy traffic on the hour (* * * * *) and prevents throttling
    - cron: '15,45 * * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Debug
        run: |
          echo "=============================="
          echo "WORKFLOW SCHEDULED TEST"
          echo "=============================="
          echo "UTC: $(date -u)"
          echo "IST: $(TZ='Asia/Kolkata' date)"
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
